<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>cert-manager</title>
        <link rel="stylesheet" href="certmanager.css" />
        <!-- The bridge to the app. Served by k8sdockside itself, always at this path. -->
        <script src="/plugin-ui/_sdk/k8sdockside.js"></script>
    </head>
    <body class="page page-overview">
        <p id="error" class="banner error" hidden></p>

        <!-- The verdict, and a countdown to the next moment that matters. -->
        <section id="hero" class="ov-hero">
            <div class="ov-loading">
                <span class="pulse"></span>
                <span>Looking for cert-manager…</span>
            </div>
        </section>

        <!-- Every certificate's validity on one timeline. -->
        <section id="runway" class="card rw" hidden></section>

        <!-- What is being issued, how far it has got, and where it is stuck. -->
        <section id="issuance" class="card issuance" hidden></section>

        <div id="columns" class="ov-columns" hidden>
            <section id="issuers" class="card"></section>
            <section id="activity" class="card"></section>
        </div>

        <section id="history" class="ov-history" hidden></section>

        <footer id="foot" class="ov-foot" hidden></footer>

        <!-- Classic scripts, not type="module": a sandboxed frame has an opaque
             origin, so a module would be a cross-origin load. -->
        <script src="model.js"></script>
        <script src="kit.js"></script>
        <script src="overview.js"></script>
    </body>
</html>
